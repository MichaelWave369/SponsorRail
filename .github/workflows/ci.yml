name: SponsorRail CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        node: [20, 22]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm test
      - run: npm run demo
      - run: npm run demo:provider
      - run: npm run demo:routing
      - run: npm run demo:failover
      - run: npm run demo:durable-health
      - run: npm run demo:campaign
      - run: npm run demo:sqlite-campaign
      - run: npm run demo:funding
      - run: npm run demo:stripe
      - run: npm run demo:reversal
      - run: npm run demo:hold
